<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>FT Group Poster</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      width: 380px;
      background: #f8fafc;
      color: #1e293b;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #0f172a;
    }
    .badge {
      background: #3b82f6;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: normal;
    }
    .config-box {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .config-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      margin-top: 4px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12px;
    }
    .btn {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
    }
    .btn-outline {
      background: white;
      border: 1px solid #cbd5e1;
      color: #334155;
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .card-title {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
      color: #0f172a;
    }
    .card-desc {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .select-group {
      font-size: 11px;
      padding: 4px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: white;
      max-width: 170px;
    }
    .status-msg {
      font-size: 11px;
      margin-top: 8px;
      padding: 6px;
      border-radius: 4px;
      display: none;
    }
    .status-success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }
    .status-error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
    .empty-msg {
      text-align: center;
      padding: 20px 0;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>
    <span>FT Group Poster</span>
    <span class="badge" id="drafts-count">0</span>
  </h2>

  <div class="config-box">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label for="workspace-url"><strong>Máy chủ Workspace:</strong></label>
      <button id="btn-save-config" class="btn btn-outline btn-sm">Lưu</button>
    </div>
    <input type="text" id="workspace-url" placeholder="https://workspace.fermat.vn" value="https://workspace.fermat.vn">
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <span style="font-weight:600; font-size:12px;">Bài viết đã duyệt:</span>
    <button id="btn-refresh" class="btn btn-outline btn-sm">Tải lại</button>
  </div>

  <div id="status-container" class="status-msg"></div>

  <div id="drafts-list">
    <div class="empty-msg">Đang kết nối tải bài viết...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
