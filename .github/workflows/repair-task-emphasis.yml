name: Repair leaked task emphasis
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Ngày bắt đầu (YYYY-MM-DD), để trống là không giới hạn'
        required: false
        default: ''
      end:
        description: 'Ngày kết thúc (YYYY-MM-DD), để trống là không giới hạn'
        required: false
        default: ''
      apply:
        description: 'Ghi thay đổi. Bỏ trống để chỉ liệt kê.'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure VPS SSH access
        env:
          VPS_HOST: ${{ secrets.DEPLOY_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing repository secret DEPLOY_HOST}"
          : "${VPS_PORT:?Missing repository secret DEPLOY_PORT}"
          : "${VPS_USERNAME:?Missing repository secret DEPLOY_USER}"
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq -o Acquire::Retries=3
            sudo apt-get install -y -qq sshpass
          fi
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Repair tasks that inherited bold from the task above
        env:
          VPS_HOST: ${{ secrets.DEPLOY_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -Eeuo pipefail
          : "${SSHPASS:?Missing repository secret DEPLOY_PASSWORD}"
          # The dates reach a remote shell, so accept only a literal date.
          for value in "$START" "$END"; do
            if [ -n "$value" ] && ! printf '%s' "$value" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "ERROR: ngày không hợp lệ: $value" >&2
              exit 1
            fi
          done
          ARGS=""
          [ -n "$START" ] && ARGS="$ARGS --start $START"
          [ -n "$END" ] && ARGS="$ARGS --end $END"
          [ "$APPLY" = "true" ] && ARGS="$ARGS --apply"
          INNER="set -e; cd /var/www/ft-workspace/backend; ../.venv/bin/python manage.py repair_leaked_task_emphasis$ARGS"
          sshpass -e ssh -p "$VPS_PORT" -o BatchMode=no -o StrictHostKeyChecking=yes "$VPS_USERNAME@$VPS_HOST" \
            "if [ \"\$(id -u)\" -eq 0 ]; then exec sudo -u workspace -H bash -lc '$INNER'; else bash -lc '$INNER'; fi"
