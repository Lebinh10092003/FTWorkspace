name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node apps-script/registration-2026-2027/Code.test.cjs
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py check
      - run: python backend/manage.py test digital_training.test_assessment_question_bank digital_training.tests.TrainingAssessmentTests.test_import_generation_honors_per_topic_practical_requirements digital_training.tests.TrainingAssessmentImportPreviewTests digital_training.test_assessment_grading_features digital_training.test_assessment_maintenance digital_training.test_assessment_lifecycle work_schedule attendance documents examination.test_work_schedule_sync examination.tests examination.test_school_import examination.test_landing_sites examination.test_registration_billing examination.test_registration_page examination.test_registration_audit examination.test_partner_contact_sync examination.test_candidate_roster_sync config.tests --noinput
      - run: python backend/manage.py makemigrations --check --dry-run

  deploy:
    name: Deploy Workspace VPS
    needs: [frontend, backend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: workspace-production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - name: Configure VPS SSH access
        env:
          VPS_HOST: ${{ secrets.DEPLOY_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing repository secret DEPLOY_HOST}"
          : "${VPS_PORT:?Missing repository secret DEPLOY_PORT}"
          : "${VPS_USERNAME:?Missing repository secret DEPLOY_USER}"
          if ! command -v sshpass >/dev/null 2>&1; then
            # The hosted runner sometimes receives an out-of-sync Chrome index.
            # Chrome is not needed for deployment, so exclude that source before
            # refreshing apt instead of letting it block the SSH setup.
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq -o Acquire::Retries=3
            sudo apt-get install -y -qq sshpass
          fi
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run isolated Workspace deployment
        env:
          VPS_HOST: ${{ secrets.DEPLOY_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          : "${SSHPASS:?Missing repository secret DEPLOY_PASSWORD}"
          # Pull before opening deploy.sh: replacing a running shell script can
          # leave Bash executing its buffered old installation steps.
          sshpass -e ssh -p "$VPS_PORT" -o BatchMode=no -o StrictHostKeyChecking=yes "$VPS_USERNAME@$VPS_HOST" 'if [ "$(id -u)" -eq 0 ]; then exec sudo -u workspace -H bash -lc "set -e; cd /var/www/ft-workspace; git pull --ff-only; bash deploy.sh; cd backend; if ../.venv/bin/python manage.py refresh_priority_task_format --apply; then if ! ../.venv/bin/python manage.py sync_work_schedule_sheet --direction both; then echo WARNING: post-deploy Sheet sync deferred to the recovery timer; fi; else echo WARNING: priority task format sync deferred to the recovery timer; fi"; else set -e; cd /var/www/ft-workspace; git pull --ff-only; bash deploy.sh; cd backend; if ../.venv/bin/python manage.py refresh_priority_task_format --apply; then if ! ../.venv/bin/python manage.py sync_work_schedule_sheet --direction both; then echo WARNING: post-deploy Sheet sync deferred to the recovery timer; fi; else echo WARNING: priority task format sync deferred to the recovery timer; fi; fi'
