# Workspace is the default site for this VPS. Keep the HTTPS block in this
# repository because deploy.sh installs this exact file on every deployment.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name workspace.fermat.vn _;

    root /var/www/ft-workspace/dist;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://workspace.fermat.vn$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name workspace.fermat.vn _;

    ssl_certificate /etc/letsencrypt/live/workspace.fermat.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workspace.fermat.vn/privkey.pem;

    root /var/www/ft-workspace/dist;
    index index.html;
    client_max_body_size 12m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # MCP khong dung OAuth nhung phai tra metadata RFC 9728 hop le de Claude / Cursor / ChatGPT
    # khong hien thi "Khong the tu dong xac dinh cai dat OAuth".
    #
    # /.well-known/oauth-protected-resource -> 200 JSON:
    #   Bao client rang may chu nay chap nhan Bearer token nhung khong dung OAuth flow.
    #   Client (claude.ai, Cursor) se biet can dung API key tu cap, khong can OAuth.
    #
    # /.well-known/oauth-authorization-server va cac duong oauth-* khac -> 404:
    #   May chu khong co Authorization Server.
    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        return 200 '{"resource":"https://workspace.fermat.vn/api/mcp","bearer_methods_supported":["header","query"]}';
    }
    # Metadata rieng cho URL ngan /mcp (RFC 9728: client thu duong co kem path truoc).
    location = /.well-known/oauth-protected-resource/mcp {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        return 200 '{"resource":"https://workspace.fermat.vn/mcp","bearer_methods_supported":["header","query"]}';
    }
    location = /.well-known/oauth-protected-resource/api/mcp {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        return 200 '{"resource":"https://workspace.fermat.vn/api/mcp","bearer_methods_supported":["header","query"]}';
    }
    location ^~ /.well-known/oauth- {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # URL MCP ngan: https://workspace.fermat.vn/mcp (giong /api/mcp). Khong co khoi nay thi
    # /mcp roi vao "location /" va tra ve trang HTML cua web.
    location ~ ^/mcp/?$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        alias /var/www/ft-workspace/backend/staticfiles/;
    }

    location /uploads/ {
        alias /var/www/ft-workspace/uploads/;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /templates/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        # SPA routes fall back to index.html; never allow that HTML shell to become stale.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
