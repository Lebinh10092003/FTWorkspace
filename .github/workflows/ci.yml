name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Chạy mọi file scripts/test-*.cjs (điểm danh coi thi, trang chủ, túi đồ...).
      - run: npm test
      - run: node apps-script/registration-2026-2027/Code.test.cjs
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py check
      # Chạy toàn bộ test của mọi phân hệ trước khi deploy (trước đây chỉ chạy danh sách chọn tay,
      # nên lỗi ở digital_training, social, chatbot, authentication, mcp có thể lên thẳng production).
      # Phải chạy trong thư mục backend: chạy từ gốc repo, Django tìm thấy 0 test mà vẫn báo thành công.
      # Bước kiểm tra số test để lỗi này không thể lặp lại âm thầm.
      - name: Run all backend tests
        working-directory: backend
        run: |
          python manage.py test --noinput 2>&1 | tee test-output.log
          ran=$(grep -oE '^Ran [0-9]+ test' test-output.log | grep -oE '[0-9]+' || echo 0)
          echo "Backend tests run: $ran"
          if [ "$ran" -lt 500 ]; then echo "::error::Chỉ chạy $ran test backend (cần >= 500). Kiểm tra lại bước test."; exit 1; fi
      - run: python backend/manage.py makemigrations --check --dry-run

  deploy:
    name: Deploy Workspace VPS
    needs: [frontend, backend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: workspace-production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      # Bảo mật SSH (chuyển dần, không làm gãy deploy hiện tại):
      # - DEPLOY_KNOWN_HOSTS: dòng known_hosts của VPS (lấy bằng `ssh-keyscan -p PORT -H HOST` từ máy tin cậy).
      #   Có secret này thì khóa máy chủ được ghim; thiếu thì quét lại mỗi lần (không chống được giả mạo máy chủ).
      # - DEPLOY_SSH_KEY: khóa riêng chỉ dùng để deploy. Có thì đăng nhập bằng khóa; thiếu thì dùng DEPLOY_PASSWORD.
      #   Khi đã có khóa, nên xóa DEPLOY_PASSWORD và tắt đăng nhập SSH bằng mật khẩu trên VPS.
      - name: Configure VPS SSH access
        env:
          VPS_HOST: ${{ secrets.DEPLOY_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing repository secret DEPLOY_HOST}"
          : "${VPS_PORT:?Missing repository secret DEPLOY_PORT}"
          : "${VPS_USERNAME:?Missing repository secret DEPLOY_USER}"
          install -d -m 700 ~/.ssh
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::Chưa có secret DEPLOY_KNOWN_HOSTS: khóa máy chủ được quét lại mỗi lần, không xác minh được VPS."
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "DEPLOY_AUTH=key" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có secret DEPLOY_SSH_KEY: đang deploy bằng mật khẩu SSH."
            echo "DEPLOY_AUTH=password" >> "$GITHUB_ENV"
            if ! command -v sshpass >/dev/null 2>&1; then
              # The hosted runner sometimes receives an out-of-sync Chrome index.
              # Chrome is not needed for deployment, so exclude that source before
              # refreshing apt instead of letting it block the SSH setup.
              sudo rm -f /etc/apt/sources.list.d/google-chrome.list
              sudo apt-get update -qq -o Acquire::Retries=3
              sudo apt-get install -y -qq sshpass
            fi
          fi

      - name: Run isolated Workspace deployment
        env:
          VPS_HOST: ${{ secrets.DEPLOY_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          # Pull before opening deploy.sh: replacing a running shell script can
          # leave Bash executing its buffered old installation steps.
          DEPLOY_STEPS='set -e; cd /var/www/ft-workspace; git pull --ff-only; bash deploy.sh; cd backend; if ../.venv/bin/python manage.py refresh_priority_task_format --apply; then if ! ../.venv/bin/python manage.py sync_work_schedule_sheet --direction both; then echo WARNING: post-deploy Sheet sync deferred to the recovery timer; fi; else echo WARNING: priority task format sync deferred to the recovery timer; fi'
          REMOTE="if [ \"\$(id -u)\" -eq 0 ]; then exec sudo -u workspace -H bash -lc '$DEPLOY_STEPS'; else bash -lc '$DEPLOY_STEPS'; fi"
          SSH_OPTS=(-p "$VPS_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          if [ "$DEPLOY_AUTH" = "key" ]; then
            ssh "${SSH_OPTS[@]}" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$VPS_USERNAME@$VPS_HOST" "$REMOTE"
          else
            : "${SSHPASS:?Missing repository secret DEPLOY_PASSWORD (or add DEPLOY_SSH_KEY)}"
            sshpass -e ssh "${SSH_OPTS[@]}" -o BatchMode=no "$VPS_USERNAME@$VPS_HOST" "$REMOTE"
          fi
